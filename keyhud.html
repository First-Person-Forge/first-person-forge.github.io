<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Overlay Bookmarklet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    textarea {
      width: 100%;
      height: 400px;
      font-family: monospace;
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      padding: 10px;
      color: #333;
      box-sizing: border-box;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h2>Overlay Bookmarklet</h2>
  <p>Copy and paste this into your bookmarks bar or console:made by leighton</p>

  <textarea id="scriptText" readonly>javascript:(()=>{const e=prompt("Enter game number:");/^\d+$/.test(e)?fetch(`https://api.contexto.me/machado/en/giveup/${e}`).then(e=>{if(!e.ok)throw new Error(`HTTP error! Status: ${e.status}`);return e.json()}).then(e=>{alert("Word: "+e.word)}).catch(e=>{console.error("Error fetching data:",e)}):alert("Invalid input. Please enter a valid game number");})();
</textarea>

  <button onclick="copyToClipboard()">Copy to Clipboard</button>

  <script>
    function copyToClipboard() {
      const textarea = document.getElementById("scriptText");
      textarea.select();
      textarea.setSelectionRange(0, 99999); // For mobile support
      document.execCommand("copy");
      alert("Script copied to clipboard!");
    }
  </script>

</body>
</html>
