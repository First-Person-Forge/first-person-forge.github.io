  <!-- UNITY STUFF -->
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">My project (4)</div>
    </div>
  </div>

  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/webgl.loader.js";
    var config = {
      dataUrl: buildUrl + "/webgl.data",
      frameworkUrl: buildUrl + "/webgl.framework.js",
      codeUrl: buildUrl + "/webgl.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "My project (4)",
      productVersion: "0.1",
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }
    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
        fullscreenButton.onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>

  <!-- JUMPSCARE -->
  <div id="jumpscare" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:black; justify-content:center; align-items:center; z-index:9999;">
    <img src="cat.png" style="width:100%; height:100%; object-fit:cover;" />
    <audio id="scream-sound" src="get-out.mp3"></audio>
  </div>

  <script>
    let buffer = "";
    document.addEventListener("keydown", (e) => {
      if (getSelection().toString()) return;
      buffer += e.key.toLowerCase();
      if (buffer.length > 6) buffer = buffer.slice(-6);
      if (buffer === "cheese") {
        const scare = document.getElementById("jumpscare");
        const scream = document.getElementById("scream-sound");
        scare.style.display = "flex";
        scream.play();
        setTimeout(() => {
          scare.style.display = "none";
          buffer = "";
        }, 2400);
      }
    });
  </script>
