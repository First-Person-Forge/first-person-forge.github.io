<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snakes & Ladders</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎲 Snakes & Ladders 🐍</h1>
  
  <!-- Legend explaining snakes and ladders -->
  <div class="legend">
    <p><span class="snake-legend">🐍</span> Snakes are red</p>
    <p><span class="ladder-legend">🪜</span> Ladders are green</p>
  </div>

  <div id="board" class="board"></div>
  <div class="controls">
    <button onclick="rollDice()">Roll Dice</button>
    <p id="dice-result">Roll the dice!</p>
    <p id="turn">Player 1's Turn</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
